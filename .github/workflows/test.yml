name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install static analysis tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-tidy cppcheck

      - name: Configure CMake for clang-tidy (all board sizes and move ordering values)
        run: |
          set -euo pipefail
          for bs in 3 4 5 6 7 8; do
            for mo in ON OFF; do
              cmake -B build/tidy-${bs}-${mo} -DBOARD_SIZE=$bs -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DENABLE_MOVE_ORDERING=$mo
            done
          done

      - name: Run clang-tidy (warnings as errors)
        run: |
          set -euo pipefail
          SRC_FILES="src/main.c src/TicTacToe/tic_tac_toe.c src/Negamax/negamax.c src/Negamax/transposition.c"
          for bs in 3 4 5 6 7 8; do
            for mo in ON OFF; do
              for f in $SRC_FILES; do
                clang-tidy "$f" -p build/tidy-${bs}-${mo} --warnings-as-errors='*'
              done
            done
          done

      - name: Run cppcheck
        run: |
          set -euo pipefail
          for bs in 3 4 5 6 7 8; do
            for mo in 0 1; do
              cppcheck --std=c11 --error-exitcode=1 --inline-suppr \
                --enable=warning,style,performance,portability \
                -DBOARD_SIZE=$bs -DENABLE_MOVE_ORDERING=$mo -I src src
            done
          done

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build, test, and verify all configurations
        run: |
          set -euo pipefail
          for bs in 3 4 5 6 7 8; do
            for mo in 0 1; do
              make CC=${{ matrix.compiler }} BOARD_SIZE=$bs ENABLE_MOVE_ORDERING=$mo BUILD=debug
              make test CC=${{ matrix.compiler }} BOARD_SIZE=$bs ENABLE_MOVE_ORDERING=$mo BUILD=debug
              make clean
              make CC=${{ matrix.compiler }} BOARD_SIZE=$bs ENABLE_MOVE_ORDERING=$mo
              make test CC=${{ matrix.compiler }} BOARD_SIZE=$bs ENABLE_MOVE_ORDERING=$mo
              if [ "$bs" -le 4 ]; then
                ./ttt -s 1000000
                echo "PASSED: perfect play verified (exit 0)"
              fi
              if [ "$bs" -eq 3 ]; then
                ./ttt --tt-size 0 -s 100000
                echo "PASSED: perfect play verified without TT (exit 0)"
                ./ttt -S 42 -s 1000
                echo "PASSED: -S seed flag verified (exit 0)"
                ./ttt --seed 42 -s 1000
                echo "PASSED: --seed flag verified (exit 0)"
              fi
              make clean
            done
          done

      - name: Validate default ENABLE_MOVE_ORDERING selection (no explicit override)
        run: |
          set -euo pipefail
          for bs in 3 5; do
            make CC=${{ matrix.compiler }} BOARD_SIZE=$bs
            make test CC=${{ matrix.compiler }} BOARD_SIZE=$bs
            make clean
          done

  test-cmake:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        native_opt: [ON, OFF]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build, test, and verify all configurations
        run: |
          set -euo pipefail
          for bs in 3 4 5 6 7 8; do
            for mo in ON OFF; do
              for bt in Debug Release; do
                cmake -B build -DBOARD_SIZE=$bs -DCMAKE_BUILD_TYPE=$bt \
                  -DENABLE_NATIVE_OPTIMIZATIONS=${{ matrix.native_opt }} \
                  -DENABLE_MOVE_ORDERING=$mo
                cmake --build build
                ctest --test-dir build --build-config $bt --output-on-failure
                if [ "$bs" -le 4 ] && [ "$bt" = "Release" ]; then
                  ./build/ttt -s 1000000
                  echo "PASSED: perfect play verified (exit 0)"
                fi
                if [ "$bs" -eq 3 ] && [ "$bt" = "Release" ]; then
                  ./build/ttt --tt-size 0 -s 100000
                  echo "PASSED: perfect play verified without TT (exit 0)"
                  ./build/ttt -S 42 -s 1000
                  echo "PASSED: -S seed flag verified (exit 0)"
                  ./build/ttt --seed 42 -s 1000
                  echo "PASSED: --seed flag verified (exit 0)"
                fi
                rm -rf build
              done
            done
          done

      - name: Validate default ENABLE_MOVE_ORDERING selection (no explicit override)
        run: |
          set -euo pipefail
          for bs in 3 5; do
            cmake -B build -DBOARD_SIZE=$bs -DCMAKE_BUILD_TYPE=Release \
              -DENABLE_NATIVE_OPTIMIZATIONS=${{ matrix.native_opt }}
            cmake --build build
            ctest --test-dir build --build-config Release --output-on-failure
            rm -rf build
          done

  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build, test, and verify all configurations
        shell: pwsh
        run: |
          foreach ($bs in @(3,4,5,6,7,8)) {
            foreach ($mo in @("ON","OFF")) {
              cmake -B build -DBOARD_SIZE=$bs -DENABLE_MOVE_ORDERING=$mo
              if ($LASTEXITCODE -ne 0) { exit 1 }
              cmake --build build --config Release
              if ($LASTEXITCODE -ne 0) { exit 1 }
              ctest --test-dir build --build-config Release --output-on-failure
              if ($LASTEXITCODE -ne 0) { exit 1 }
              if ($bs -le 4) {
                ./build/Release/ttt.exe -s 1000000
                if ($LASTEXITCODE -ne 0) { exit 1 }
                Write-Host "PASSED: perfect play verified (exit 0)"
              }
              if ($bs -eq 3) {
                ./build/Release/ttt.exe --tt-size 0 -s 100000
                if ($LASTEXITCODE -ne 0) { exit 1 }
                Write-Host "PASSED: perfect play verified without TT (exit 0)"
                ./build/Release/ttt.exe -S 42 -s 1000
                if ($LASTEXITCODE -ne 0) { exit 1 }
                Write-Host "PASSED: -S seed flag verified (exit 0)"
                ./build/Release/ttt.exe --seed 42 -s 1000
                if ($LASTEXITCODE -ne 0) { exit 1 }
                Write-Host "PASSED: --seed flag verified (exit 0)"
              }
              Remove-Item -Recurse -Force build
            }
          }
          # Validate default ENABLE_MOVE_ORDERING selection (no explicit override)
          foreach ($bs in @(3,5)) {
            cmake -B build -DBOARD_SIZE=$bs
            if ($LASTEXITCODE -ne 0) { exit 1 }
            cmake --build build --config Release
            if ($LASTEXITCODE -ne 0) { exit 1 }
            ctest --test-dir build --build-config Release --output-on-failure
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Remove-Item -Recurse -Force build
          }

  build-portable:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build, smoke test, and verify all configurations
        run: |
          set -euo pipefail
          for bs in 3 4 5 6 7 8; do
            for mo in 0 1; do
              make portable BOARD_SIZE=$bs ENABLE_MOVE_ORDERING=$mo
              ./ttt --help
              if [ "$bs" -le 4 ]; then
                ./ttt -s 1000000
                echo "PASSED: perfect play verified (exit 0)"
              fi
              make clean
            done
          done

  strict-warnings:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build with strict warnings (all configurations)
        run: |
          set -euo pipefail
          COMMON="-Wall -Wextra -Wpedantic -Werror"
          COMMON="$COMMON -Wshadow -Wconversion -Wsign-conversion -Wformat=2 -Wundef"
          COMMON="$COMMON -Wdouble-promotion -Wcast-qual -Wnull-dereference"
          COMMON="$COMMON -Wvla -Wwrite-strings -Wswitch-enum"
          if [ "${{ matrix.compiler }}" = "gcc" ] && [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            COMMON="$COMMON -Wlogical-op -Wduplicated-cond -Wduplicated-branches"
          fi

          # Prototype warnings apply to production code but not Unity test functions
          # (test functions are called via RUN_TEST() macro, no headers exist for them)
          APP_STRICT="$COMMON -Wstrict-prototypes -Wmissing-prototypes -Wold-style-definition"
          TEST_STRICT="$COMMON"

          APP_SRC="src/main.c src/TicTacToe/tic_tac_toe.c src/Negamax/negamax.c src/Negamax/transposition.c"
          TEST_SRC="test/test_runner.c test/test_bitboard.c test/test_negamax.c test/test_zobrist.c test/test_transposition_table.c test/test_game_scenarios.c test/test_edge_cases.c test/test_correctness.c test/unity/unity.c src/TicTacToe/tic_tac_toe.c src/Negamax/negamax.c src/Negamax/transposition.c"

          for bs in 3 4 5 6 7 8; do
            for mo in 0 1; do
              ${{ matrix.compiler }} -std=c11 -O1 $APP_STRICT -DBOARD_SIZE=$bs -DENABLE_MOVE_ORDERING=$mo \
                $APP_SRC \
                -o /dev/null -lm

              ${{ matrix.compiler }} -std=c11 -O1 $TEST_STRICT -DBOARD_SIZE=$bs -DENABLE_MOVE_ORDERING=$mo -I test/unity \
                $TEST_SRC \
                -o /dev/null -lm
            done
          done

  sanitize:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build and run under ASan+UBSan (all configurations)
        run: |
          set -euo pipefail
          for bs in 3 4 5 6 7 8; do
            for mo in 0 1; do
              ${{ matrix.compiler }} -std=c11 -O1 -Wall -Wextra -Werror -g -fno-omit-frame-pointer \
                -fsanitize=address,undefined,float-divide-by-zero,float-cast-overflow,pointer-compare,pointer-subtract \
                -DBOARD_SIZE=$bs -DENABLE_MOVE_ORDERING=$mo -I test/unity \
                test/test_runner.c test/test_bitboard.c test/test_negamax.c test/test_zobrist.c \
                test/test_transposition_table.c test/test_game_scenarios.c test/test_edge_cases.c \
                test/test_correctness.c test/unity/unity.c \
                src/TicTacToe/tic_tac_toe.c src/Negamax/negamax.c src/Negamax/transposition.c \
                -o test_runner_san -lm
              ./test_runner_san
              if [ "$bs" -le 4 ]; then
                ${{ matrix.compiler }} -std=c11 -O1 -Wall -Wextra -Werror -g -fno-omit-frame-pointer \
                  -fsanitize=address,undefined,float-divide-by-zero,float-cast-overflow,pointer-compare,pointer-subtract \
                  -DBOARD_SIZE=$bs -DENABLE_MOVE_ORDERING=$mo \
                  src/main.c src/TicTacToe/tic_tac_toe.c src/Negamax/negamax.c src/Negamax/transposition.c \
                  -o ttt_san -lm
                ./ttt_san -s 1000 -q
              fi
            done
          done

  valgrind:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install valgrind
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Build and run under valgrind (all configurations)
        run: |
          set -euo pipefail
          for bs in 3 4 5 6 7 8; do
            for mo in 0 1; do
              ${{ matrix.compiler }} -std=c11 -O1 -g -Wall -Wextra -Werror \
                -DBOARD_SIZE=$bs -DENABLE_MOVE_ORDERING=$mo -I test/unity \
                test/test_runner.c test/test_bitboard.c test/test_negamax.c test/test_zobrist.c \
                test/test_transposition_table.c test/test_game_scenarios.c test/test_edge_cases.c \
                test/test_correctness.c test/unity/unity.c \
                src/TicTacToe/tic_tac_toe.c src/Negamax/negamax.c src/Negamax/transposition.c \
                -o test_runner_valgrind -lm
              valgrind --leak-check=full --show-leak-kinds=all \
                --errors-for-leak-kinds=all --error-exitcode=1 \
                ./test_runner_valgrind
              if [ "$bs" -le 4 ]; then
                ${{ matrix.compiler }} -std=c11 -O1 -g -Wall -Wextra -Werror \
                  -DBOARD_SIZE=$bs -DENABLE_MOVE_ORDERING=$mo \
                  src/main.c src/TicTacToe/tic_tac_toe.c src/Negamax/negamax.c src/Negamax/transposition.c \
                  -o ttt_valgrind -lm
                valgrind --leak-check=full --show-leak-kinds=all \
                  --errors-for-leak-kinds=all --error-exitcode=1 \
                  ./ttt_valgrind -s 1000 -q
              fi
            done
          done
