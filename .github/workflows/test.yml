name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install static analysis tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-tidy cppcheck

      - name: Configure CMake for clang-tidy (BOARD_SIZE=3..8)
        run: |
          set -euo pipefail
          for bs in 3 4 5 6 7 8; do
            cmake -B build/tidy-$bs -DBOARD_SIZE=$bs -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          done

      - name: Run clang-tidy (warnings as errors)
        run: |
          set -euo pipefail
          SRC_FILES="src/main.c src/TicTacToe/tic_tac_toe.c src/Negamax/negamax.c src/Negamax/transposition.c"
          for bs in 3 4 5 6 7 8; do
            for f in $SRC_FILES; do
              clang-tidy "$f" -p build/tidy-$bs --warnings-as-errors='*'
            done
          done

      - name: Run cppcheck
        run: |
          set -euo pipefail
          for bs in 3 4 5 6 7 8; do
            cppcheck --std=c11 --error-exitcode=1 --inline-suppr \
              --enable=warning,style,performance,portability \
              -DBOARD_SIZE=$bs -I src src
          done

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        board_size: [3, 4, 5, 6, 7, 8]
        move_ordering: [0, 1]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build
        run: |
          set -euo pipefail
          make CC=${{ matrix.compiler }} BOARD_SIZE=${{ matrix.board_size }} ENABLE_MOVE_ORDERING=${{ matrix.move_ordering }}

      - name: Run tests
        run: |
          set -euo pipefail
          make test CC=${{ matrix.compiler }} BOARD_SIZE=${{ matrix.board_size }} ENABLE_MOVE_ORDERING=${{ matrix.move_ordering }}

      - name: Self-play verification
        if: matrix.board_size == 3 || matrix.board_size == 4
        run: |
          set -euo pipefail
          ./ttt -s 1000000
          echo "PASSED: perfect play verified (exit 0)"

      - name: Self-play verification (TT disabled, 3x3 only)
        if: matrix.board_size == 3
        run: |
          set -euo pipefail
          ./ttt --tt-size 0 -s 100000
          echo "PASSED: perfect play verified without TT (exit 0)"

  test-cmake:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        board_size: [3, 4, 5, 6, 7, 8]
        native_opt: [ON, OFF]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure CMake
        run: |
          set -euo pipefail
          cmake -B build -DBOARD_SIZE=${{ matrix.board_size }} -DCMAKE_BUILD_TYPE=Release -DENABLE_NATIVE_OPTIMIZATIONS=${{ matrix.native_opt }}

      - name: Build
        run: |
          set -euo pipefail
          cmake --build build --config Release

      - name: Run tests
        run: |
          set -euo pipefail
          ctest --test-dir build --build-config Release --output-on-failure

      - name: Self-play verification
        if: matrix.board_size == 3 || matrix.board_size == 4
        run: |
          set -euo pipefail
          ./build/ttt -s 1000000
          echo "PASSED: perfect play verified (exit 0)"

      - name: Self-play verification (TT disabled, 3x3 only)
        if: matrix.board_size == 3
        run: |
          set -euo pipefail
          ./build/ttt --tt-size 0 -s 100000
          echo "PASSED: perfect play verified without TT (exit 0)"

  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        board_size: [3, 4, 5, 6, 7, 8]
        move_ordering: [ON, OFF]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure CMake
        run: cmake -B build -DBOARD_SIZE=${{ matrix.board_size }} -DENABLE_MOVE_ORDERING=${{ matrix.move_ordering }}

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Self-play verification
        if: matrix.board_size == 3 || matrix.board_size == 4
        shell: pwsh
        run: |
          ./build/Release/ttt.exe -s 1000000
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "PASSED: perfect play verified (exit 0)"

      - name: Self-play verification (TT disabled, 3x3 only)
        if: matrix.board_size == 3
        shell: pwsh
        run: |
          ./build/Release/ttt.exe --tt-size 0 -s 100000
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "PASSED: perfect play verified without TT (exit 0)"

  build-portable:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build portable release
        run: |
          set -euo pipefail
          make portable BOARD_SIZE=3

      - name: Smoke test
        run: |
          set -euo pipefail
          ./ttt --help

      - name: Self-play verification
        run: |
          set -euo pipefail
          ./ttt -s 1000000
          echo "PASSED: perfect play verified (exit 0)"

  strict-warnings:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        board_size: [3, 4, 5, 6, 7, 8]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build with strict warnings
        run: |
          set -euo pipefail
          COMMON="-Wall -Wextra -Wpedantic -Werror"
          COMMON="$COMMON -Wshadow -Wconversion -Wsign-conversion -Wformat=2 -Wundef"
          COMMON="$COMMON -Wdouble-promotion -Wcast-qual -Wnull-dereference"
          COMMON="$COMMON -Wvla -Wwrite-strings -Wswitch-enum"
          if [ "${{ matrix.compiler }}" = "gcc" ] && [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            COMMON="$COMMON -Wlogical-op -Wduplicated-cond -Wduplicated-branches"
          fi

          # Prototype warnings apply to production code but not Unity test functions
          # (test functions are called via RUN_TEST() macro, no headers exist for them)
          APP_STRICT="$COMMON -Wstrict-prototypes -Wmissing-prototypes -Wold-style-definition"
          TEST_STRICT="$COMMON"

          APP_SRC="src/main.c src/TicTacToe/tic_tac_toe.c src/Negamax/negamax.c src/Negamax/transposition.c"
          TEST_SRC="test/test_runner.c test/test_bitboard.c test/test_negamax.c test/test_zobrist.c test/test_transposition_table.c test/test_game_scenarios.c test/test_edge_cases.c test/test_correctness.c test/unity/unity.c src/TicTacToe/tic_tac_toe.c src/Negamax/negamax.c src/Negamax/transposition.c"

          ${{ matrix.compiler }} -std=c11 -O1 $APP_STRICT -DBOARD_SIZE=${{ matrix.board_size }} \
            $APP_SRC \
            -o /dev/null -lm

          ${{ matrix.compiler }} -std=c11 -O1 $TEST_STRICT -DBOARD_SIZE=${{ matrix.board_size }} -I test/unity \
            $TEST_SRC \
            -o /dev/null -lm

  sanitize:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        board_size: [3, 4, 5, 6, 7, 8]
        move_ordering: [0, 1]
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build and run tests under ASan+UBSan
        run: |
          set -euo pipefail
          ${{ matrix.compiler }} -std=c11 -O1 -Wall -Wextra -Werror -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined,float-divide-by-zero,float-cast-overflow,pointer-compare,pointer-subtract \
            -DBOARD_SIZE=${{ matrix.board_size }} -DENABLE_MOVE_ORDERING=${{ matrix.move_ordering }} -I test/unity \
            test/test_runner.c test/test_bitboard.c test/test_negamax.c test/test_zobrist.c \
            test/test_transposition_table.c test/test_game_scenarios.c test/test_edge_cases.c \
            test/test_correctness.c test/unity/unity.c \
            src/TicTacToe/tic_tac_toe.c src/Negamax/negamax.c src/Negamax/transposition.c \
            -o test_runner_san -lm
          ./test_runner_san

      - name: Run self-play under ASan+UBSan (3x3/4x4)
        if: matrix.board_size == 3 || matrix.board_size == 4
        run: |
          set -euo pipefail
          ${{ matrix.compiler }} -std=c11 -O1 -Wall -Wextra -Werror -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined,float-divide-by-zero,float-cast-overflow,pointer-compare,pointer-subtract \
            -DBOARD_SIZE=${{ matrix.board_size }} -DENABLE_MOVE_ORDERING=${{ matrix.move_ordering }} \
            src/main.c src/TicTacToe/tic_tac_toe.c src/Negamax/negamax.c src/Negamax/transposition.c \
            -o ttt_san -lm
          ./ttt_san -s 1000 -q

  valgrind:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        board_size: [3, 4, 5, 6, 7, 8]
        move_ordering: [0, 1]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install valgrind
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Build test runner for valgrind
        run: |
          set -euo pipefail
          ${{ matrix.compiler }} -std=c11 -O1 -g -Wall -Wextra -Werror \
            -DBOARD_SIZE=${{ matrix.board_size }} -DENABLE_MOVE_ORDERING=${{ matrix.move_ordering }} -I test/unity \
            test/test_runner.c test/test_bitboard.c test/test_negamax.c test/test_zobrist.c \
            test/test_transposition_table.c test/test_game_scenarios.c test/test_edge_cases.c \
            test/test_correctness.c test/unity/unity.c \
            src/TicTacToe/tic_tac_toe.c src/Negamax/negamax.c src/Negamax/transposition.c \
            -o test_runner_valgrind -lm

      - name: Run tests under valgrind
        run: |
          set -euo pipefail
          valgrind --leak-check=full --show-leak-kinds=all \
            --errors-for-leak-kinds=all --error-exitcode=1 \
            ./test_runner_valgrind

      - name: Run self-play under valgrind (3x3/4x4)
        if: matrix.board_size == 3 || matrix.board_size == 4
        run: |
          set -euo pipefail
          ${{ matrix.compiler }} -std=c11 -O1 -g -Wall -Wextra -Werror \
            -DBOARD_SIZE=${{ matrix.board_size }} -DENABLE_MOVE_ORDERING=${{ matrix.move_ordering }} \
            src/main.c src/TicTacToe/tic_tac_toe.c src/Negamax/negamax.c src/Negamax/transposition.c \
            -o ttt_valgrind -lm
          valgrind --leak-check=full --show-leak-kinds=all \
            --errors-for-leak-kinds=all --error-exitcode=1 \
            ./ttt_valgrind -s 1000 -q
